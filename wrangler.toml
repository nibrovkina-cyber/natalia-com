# Cloudflare Pages config for Next.js via @cloudflare/next-on-pages
# Generated for natashabrovkina.com deployment.

name = "natashabrovkina"
compatibility_date = "2026-05-04"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npx @cloudflare/next-on-pages@1"

[build.upload]
format = "service-worker"

# Pages project — directories
pages_build_output_dir = ".vercel/output/static"
